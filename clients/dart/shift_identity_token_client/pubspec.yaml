name: shift_identity_token_client
description: >-
  Keeps a ShiftIdentity session alive and hands out a valid access token.
  Refreshes ahead of expiry, one refresh at a time, and tells "sign in again"
  apart from "temporarily unavailable". Pure Dart; works in Flutter.
version: 1.0.0
repository: https://github.com/ShiftSoftware/ShiftIdentity/tree/master/clients/dart/shift_identity_token_client
issue_tracker: https://github.com/ShiftSoftware/ShiftIdentity/issues
topics:
  - authentication
  - oauth
  - token
  - refresh-token
  - http

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^4.0.0
  test: ^1.25.0
